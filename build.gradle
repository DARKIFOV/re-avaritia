plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    runtimeOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    runtimeOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    compileOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    runtimeOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:15.20.0.112")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:15.20.0.112")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:15.20.0.112")
}

def bundledAssetsZip = file('tools/generated_assets.zip')
def generatedAssetsDir = layout.buildDirectory.dir('generated/metatech_assets')

tasks.register('extractBundledAssets', Copy) {
    inputs.file bundledAssetsZip
    outputs.dir generatedAssetsDir
    doFirst { delete generatedAssetsDir.get().asFile }
    from { zipTree(bundledAssetsZip) }
    into generatedAssetsDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('applySourceHotfixes') {
    inputs.files file('tools/apply_068_hotfixes.py'), file('tools/install_068_textures.py')
    outputs.upToDateWhen { false }
    doLast {
        exec {
            commandLine 'python3', 'tools/apply_068_hotfixes.py'
        }
        exec {
            commandLine 'python3', 'tools/install_068_textures.py'
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('applySourceHotfixes')
}

sourceSets.main.resources.srcDir generatedAssetsDir

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('extractBundledAssets')
    dependsOn tasks.named('applySourceHotfixes')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def replaceProperties = [minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}
