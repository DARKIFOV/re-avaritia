plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    runtimeOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    compileOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    runtimeOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:15.20.0.112")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:15.20.0.112")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:15.20.0.112")
}

// Keep the complete 0.4 resource bundle and apply the 0.5.2 item/recipe overlay.
def encodedAssetsDir = file('tools/generated_assets_v052')
def generatedAssetsZip = layout.buildDirectory.file('generated/metatech_assets_v052.zip')
def generatedAssetsDir = layout.buildDirectory.dir('generated/metatech_assets_v052')

tasks.register('decodeGeneratedAssets') {
    inputs.dir encodedAssetsDir
    outputs.file generatedAssetsZip
    doLast {
        def chunks = fileTree(encodedAssetsDir) { include '*.b64' }.files.sort { a, b -> a.name <=> b.name }
        if (chunks.isEmpty()) throw new GradleException("No generated asset chunks found in ${encodedAssetsDir}")
        def encoded = new StringBuilder()
        chunks.each { encoded.append(it.getText('UTF-8').replaceAll('\\s+', '')) }
        def target = generatedAssetsZip.get().asFile
        target.parentFile.mkdirs()
        target.bytes = encoded.toString().decodeBase64()
    }
}

tasks.register('extractBaseAssets', Copy) {
    inputs.file file('tools/generated_assets.zip')
    outputs.dir generatedAssetsDir
    doFirst { delete generatedAssetsDir.get().asFile }
    from zipTree(file('tools/generated_assets.zip'))
    into generatedAssetsDir
}

tasks.register('extractGeneratedAssets', Copy) {
    dependsOn tasks.named('extractBaseAssets'), tasks.named('decodeGeneratedAssets')
    from { zipTree(generatedAssetsZip.get().asFile) }
    into generatedAssetsDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
sourceSets.main.resources.srcDir generatedAssetsDir

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('extractGeneratedAssets')
    def replaceProperties = [minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
