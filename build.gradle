plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Bundle the 1.20.1 Extreme Molecular Assembler and 9x9 Pattern Terminal as a
// Forge Jar-in-Jar dependency. It remains a separate nested mod (ccapplied),
// so its own MIT license, metadata and AE2 registrations are preserved.
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    runtimeOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    runtimeOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    compileOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    runtimeOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:15.20.0.112")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:15.20.0.112")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:15.20.0.112")

    // AE2 Molecular Assembler Plus 1.0.0 for Minecraft 1.20.1 Forge.
    // CurseMaven exposes the exact file ID without Maven version metadata, so
    // resolve that exact artifact and put the supported range into JarJar metadata.
    runtimeOnly fg.deobf('curse.maven:ae2-molecular-assembler-plus-1493468:8093809')
    jarJar(group: 'curse.maven', name: 'ae2-molecular-assembler-plus-1493468',
            version: '8093809') {
        jarJar.pin(it, '[8093809,8093810)')
    }
}

// Keep the last known-good 0.4 machine textures during code and dependency
// verification. The new item texture overlay will be restored after CI is green.
def generatedAssetsDir = layout.buildDirectory.dir("generated/metatech_assets")
tasks.register('extractGeneratedAssets', Copy) {
    from zipTree(file('tools/generated_assets.zip'))
    into generatedAssetsDir
}
sourceSets.main.resources.srcDir generatedAssetsDir

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('extractGeneratedAssets')
    def replaceProperties = [minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
