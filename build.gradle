plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    runtimeOnly fg.deobf('curse.maven:re-avaritia-623969:8497793')
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    runtimeOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    compileOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    runtimeOnly fg.deobf('vazkii.botania:Botania:1.20.1-454-FORGE')
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:15.20.0.112")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:15.20.0.112")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:15.20.0.112")
}

def encodedBaseAssetsDir = file('tools/generated_assets_clean_v057')
def generatedBaseAssetsZip = layout.buildDirectory.file('generated/metatech_base_assets.zip')
def encodedDrillAssetsDir = file('tools/generated_assets_drill_v055')
def generatedDrillAssetsZip = layout.buildDirectory.file('generated/metatech_drill_assets.zip')
def encodedV059AssetsDir = file('tools/generated_assets_v059')
def generatedV059AssetsZip = layout.buildDirectory.file('generated/metatech_v059_assets.zip')
def encodedV059SourcesDir = file('tools/generated_sources_v059')
def generatedV059SourcesZip = layout.buildDirectory.file('generated/metatech_v059_sources.zip')
def generatedSourcesDir = layout.buildDirectory.dir('generated/metatech_sources')
def generatedAssetsDir = layout.buildDirectory.dir('generated/metatech_assets')

tasks.register('decodeBaseAssets') {
    inputs.dir encodedBaseAssetsDir
    outputs.file generatedBaseAssetsZip
    doLast {
        def chunks = fileTree(encodedBaseAssetsDir) { include '*.b64' }.files.sort { a, b -> a.name <=> b.name }
        if (chunks.isEmpty()) throw new GradleException("No clean base asset chunks found in ${encodedBaseAssetsDir}")
        def encoded = new StringBuilder()
        chunks.each { encoded.append(it.getText('UTF-8').replaceAll('\\s+', '')) }
        def target = generatedBaseAssetsZip.get().asFile
        target.parentFile.mkdirs(); target.bytes = encoded.toString().decodeBase64()
    }
}

tasks.register('decodeDrillAssets') {
    inputs.dir encodedDrillAssetsDir
    outputs.file generatedDrillAssetsZip
    doLast {
        def chunks = fileTree(encodedDrillAssetsDir) { include '*.b64' }.files.sort { a, b -> a.name <=> b.name }
        if (chunks.isEmpty()) throw new GradleException("No mana drill texture chunks found in ${encodedDrillAssetsDir}")
        def encoded = new StringBuilder()
        chunks.each { encoded.append(it.getText('UTF-8').replaceAll('\\s+', '')) }
        def target = generatedDrillAssetsZip.get().asFile
        target.parentFile.mkdirs(); target.bytes = encoded.toString().decodeBase64()
    }
}

tasks.register('decodeV059Assets') {
    inputs.dir encodedV059AssetsDir
    outputs.file generatedV059AssetsZip
    doLast {
        def chunks = fileTree(encodedV059AssetsDir) { include '*.b64' }.files.sort { a, b -> a.name <=> b.name }
        if (chunks.isEmpty()) throw new GradleException("No 0.5.9 asset chunks found in ${encodedV059AssetsDir}")
        def encoded = new StringBuilder()
        chunks.each { encoded.append(it.getText('UTF-8').replaceAll('\\s+', '')) }
        def target = generatedV059AssetsZip.get().asFile
        target.parentFile.mkdirs(); target.bytes = encoded.toString().decodeBase64()
    }
}

tasks.register('decodeV059Sources') {
    inputs.dir encodedV059SourcesDir
    outputs.file generatedV059SourcesZip
    doLast {
        def chunks = fileTree(encodedV059SourcesDir) { include '*.b64' }.files.sort { a, b -> a.name <=> b.name }
        if (chunks.isEmpty()) throw new GradleException("No 0.5.9 source chunks found in ${encodedV059SourcesDir}")
        def encoded = new StringBuilder()
        chunks.each { encoded.append(it.getText('UTF-8').replaceAll('\\s+', '')) }
        def target = generatedV059SourcesZip.get().asFile
        target.parentFile.mkdirs(); target.bytes = encoded.toString().decodeBase64()
    }
}

tasks.register('extractV059Sources', Copy) {
    dependsOn tasks.named('decodeV059Sources')
    inputs.file generatedV059SourcesZip
    outputs.dir generatedSourcesDir
    doFirst { delete generatedSourcesDir.get().asFile }
    from { zipTree(generatedV059SourcesZip.get().asFile) }
    into generatedSourcesDir
}

tasks.register('extractBaseAssets', Copy) {
    dependsOn tasks.named('decodeBaseAssets')
    inputs.file generatedBaseAssetsZip
    outputs.dir generatedAssetsDir
    doFirst { delete generatedAssetsDir.get().asFile }
    from { zipTree(generatedBaseAssetsZip.get().asFile) }
    into generatedAssetsDir
}

tasks.register('extractDrillReworkAssets', Copy) {
    dependsOn tasks.named('extractBaseAssets'), tasks.named('decodeDrillAssets')
    from { zipTree(generatedDrillAssetsZip.get().asFile) }
    into generatedAssetsDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('extractV059Assets', Copy) {
    dependsOn tasks.named('extractDrillReworkAssets'), tasks.named('decodeV059Assets')
    from { zipTree(generatedV059AssetsZip.get().asFile) }
    into generatedAssetsDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

sourceSets.main.resources.srcDir generatedAssetsDir

def v059ReplacedSources = [
    'ru/rfvv/metatechreborn/MetaTechReborn.java',
    'ru/rfvv/metatechreborn/config/CommonConfig.java',
    'ru/rfvv/metatechreborn/client/ClientModEvents.java',
    'ru/rfvv/metatechreborn/registry/ModItems.java',
    'ru/rfvv/metatechreborn/registry/ModBlocks.java',
    'ru/rfvv/metatechreborn/registry/ModBlockEntities.java',
    'ru/rfvv/metatechreborn/registry/ModMenus.java',
    'ru/rfvv/metatechreborn/registry/ModRecipes.java'
]

tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('extractV059Sources')
    source = files(
        fileTree('src/main/java') { v059ReplacedSources.each { exclude it } },
        fileTree(generatedSourcesDir.get().asFile) { include 'src/main/java/**/*.java' }
    )
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('extractV059Assets')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def replaceProperties = [minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfJar'
}
