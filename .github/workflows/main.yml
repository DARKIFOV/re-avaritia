name: Build MetaTech Reborn

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 0.4.0 fixes and generated textures
        shell: bash
        run: |
          cat port-fixes/0.4.0/patch.*.b64 \
            | base64 --decode \
            | gzip -dc > /tmp/metatech-0.4.0.patch
          patch -p1 < /tmp/metatech-0.4.0.patch

          mkdir -p tools
          cat port-fixes/0.4.0/assets.*.b64 \
            | base64 --decode > tools/generated_assets.zip
          unzip -t tools/generated_assets.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetaTech-Reborn-0.4.0-fixes-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
