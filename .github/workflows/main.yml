name: Build MetaTech Reborn

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Several generated-resource commits can arrive close together. Keep only the
# newest build for each branch/PR so old queued runs do not delay verification.
concurrency:
  group: metatech-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod and 9x9 companion JARs
        uses: actions/upload-artifact@v4
        with:
          name: MetaTech-Reborn-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/addons/*.jar
          if-no-files-found: error
