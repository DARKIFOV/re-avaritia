name: Build MetaTech Reborn

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: metatech-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build unified mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload unified MetaTech JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetaTech-Reborn-unified-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
