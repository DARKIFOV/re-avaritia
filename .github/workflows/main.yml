name: Build MetaTech Reborn

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore canonical 0.4.0 source
        shell: bash
        run: |
          cat port-fixes/0.4.0/source.*.b64 \
            | base64 --decode > /tmp/metatech-source.tar.xz
          mkdir -p /tmp/metatech-source
          tar -xJf /tmp/metatech-source.tar.xz -C /tmp/metatech-source
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name port-fixes \
            -exec rm -rf {} +
          cp -a /tmp/metatech-source/MetaTech-Reborn-1.20.1/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MetaTech-Reborn-0.4.0-fixes-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish canonical source to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/0.4.0-fixes'
        shell: bash
        run: |
          rm -rf port-fixes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish MetaTech Reborn 0.4.0 fixes"
            git push origin HEAD:agent/0.4.0-fixes
          fi
