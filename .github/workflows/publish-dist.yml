name: Publish MetaTech JAR to main

on:
  workflow_run:
    workflows: ["Build MetaTech Reborn"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-metatech-dist
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: MetaTech-Reborn-unified-${{ github.event.workflow_run.head_sha }}
          path: build-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish JAR and checksum to dist
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build-artifact -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          test -n "$JAR"

          mkdir -p dist
          cp "$JAR" dist/metatech_reborn-0.6.77.jar
          sha256sum dist/metatech_reborn-0.6.77.jar > dist/SHA256SUMS.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/metatech_reborn-0.6.77.jar dist/SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "The verified 0.6.77 JAR is already published."
            exit 0
          fi

          git commit -m "Publish verified MetaTech Reborn 0.6.77 JAR [skip ci]"
          git push origin HEAD:main
