name: Compile diagnostics

on:
  push:
    branches:
      - agent/0.6.0-molecular-assembler
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile and capture log
        id: compile
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew compileJava --stacktrace --no-daemon > compile.log 2>&1
          status=$?
          echo "$status" > compile.status
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatech-compile-diagnostics
          path: |
            compile.log
            compile.status
          if-no-files-found: error
          retention-days: 3

      - name: Fail when compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
